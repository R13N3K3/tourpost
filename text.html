<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Video Uploader</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex flex-col items-center justify-center">

<div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6">
<h1 class="text-xl font-bold text-gray-800 mb-4 text-center">📱 Video Multi-Upload</h1>

<form id="uploadForm" class="space-y-4">
<!-- Video Auswahl -->
<div>
<label class="block text-sm font-medium text-gray-700 mb-1">Video auswählen</label>
<input type="file" id="videoFile" accept="video/*" required
class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
</div>

<!-- Titel -->
<div>
<label class="block text-sm font-medium text-gray-700 mb-1">Titel / Caption</label>
<input type="text" id="videoTitle" placeholder="Dein Video-Titel..." required
class="w-full px-3 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"/>
</div>

<!-- Hashtags -->
<div>
<label class="block text-sm font-medium text-gray-700 mb-1">Hashtags</label>
<input type="text" id="videoTags" placeholder="#viral #foryou #trending"
class="w-full px-3 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"/>
</div>

<!-- Submit Button -->
<button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl shadow-md hover:bg-blue-700 transition">
🚀 Auf allen Plattformen teilen
</button>
</form>

<div id="status" class="mt-4 text-center text-sm font-medium text-gray-600"></div>
</div>

<script>
document.getElementById('uploadForm').addEventListener('submit', async (e) => {
e.preventDefault();
const status = document.getElementById('status');
status.innerText = "📤 Upload läuft & wird verteilt...";

const formData = new FormData();
formData.append('video', document.getElementById('videoFile').files[0]);
formData.append('title', document.getElementById('videoTitle').value);
formData.append('tags', document.getElementById('videoTags').value);

try {
const response = await('/api/upload', {
method: 'POST',
body: formData
});
const result = await response.json();
status.innerText = "✅ Erfolgreich auf allen Plattformen geteilt!";
} catch (err) {
status.innerText = "❌ Fehler beim Upload.";
}
});
</script>
</body>
</html>
